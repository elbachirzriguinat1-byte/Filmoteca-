
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="card p-3 m-2 shadow" style="width: 250px">

  <h3>{{ Films.titol }}</h3>

  <img 
    [src]="Films.cartellUrl" 
    class="card-img-top"
    alt="{{ Films.titol }}"
    style="height: 350px; object-fit: cover;"
  >

  <div class="card-body">

    <p><strong>Director:</strong> {{ Films.director }}</p>

    <p><strong>Año:</strong> {{ Films.any }}</p>

    <p><strong>Duración:</strong> {{ Films.durada }} min</p>

    <p><strong>Género:</strong> {{ Films.genere }}</p>

    <p><strong>Valoración:</strong> ⭐ {{ Films.valoracio }}/10</p>

    @if (Films.disponible) {
      <span class="badge bg-success mb-2">Disponible</span>
    } @else {
      <span class="badge bg-danger mb-2">No disponible</span>
    }

    <button
      class="btn btn-primary w-100 mt-2"
      [disabled]="!Films.disponible"
      (click)="Afegir_al_carret()">
      Añadir al carrito
    </button>

  </div>
</div>
