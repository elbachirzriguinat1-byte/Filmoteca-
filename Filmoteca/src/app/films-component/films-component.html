<div class="container-fluid bg-light min-vh-100 py-4">

  <header class="container mb-4">
    <div class="bg-dark text-white p-4 rounded-3 shadow-sm">
      <h1 class="display-5 fw-bold">Mi tienda</h1>
      <p class="text-secondary mb-0 text-white-50">
        Bienvenido a nuestra filmoteca. Encuentra tus películas favoritas.
      </p>
    </div>
  </header>

  <div class="container">

    <h2 class="text-center fw-bold mb-4">Catálogo de películas</h2>

    <div class="row g-4 justify-content-center">

      @for (film of Films_list; track film.id) {

        <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center">

          <app-films-hijo-component
            [Films]="film"
            (Agregar)="Afegir_al_carret($event)">
          </app-films-hijo-component>

        </div>

      }

    </div>

  </div>

  <hr class="container my-5">

</div>
